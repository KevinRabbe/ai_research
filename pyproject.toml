[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plural-cognition"
version = "0.1.0"
description = "Controlled experiments for plural cognition and structured synthesis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin Rabbe" }]
dependencies = []

[project.scripts]
plural-cognition-cuda-preflight = "plural_cognition.cuda_preflight:main"
plural-cognition-sandbox-preflight = "plural_cognition.collective.sandbox_preflight:main"
plural-cognition-resolve-screening = "plural_cognition.prepare_cli:resolve_screening_plan_main"
plural-cognition-resolve-t20m-screening = "plural_cognition.recovery_cli:resolve_t20m_screening_main"
plural-cognition-resolve-t30m-screening = "plural_cognition.recovery_cli:resolve_t30m_screening_main"
plural-cognition-build-dataset = "plural_cognition.prepare_cli:build_dataset_shard_main"
plural-cognition-prepare-execution = "plural_cognition.prepare_cli:prepare_execution_main"
plural-cognition-prepare-screening-executions = "plural_cognition.prepare_cli:prepare_all_executions_main"
plural-cognition-train = "plural_cognition.train_cli:main"
plural-cognition-evaluate = "plural_cognition.evaluate_cli:main"
plural-cognition-select-scale = "plural_cognition.select_scale_cli:main"
plural-cognition-prepare-population-plan = "plural_cognition.population_plan_cli:main"
plural-cognition-evaluate-population = "plural_cognition.population_eval_cli:main"
plural-cognition-compare-conditions = "plural_cognition.compare_conditions_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
train = [
  "torch>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
