[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plural-cognition"
version = "0.1.0"
description = "Controlled experiments for plural cognition and structured synthesis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin Rabbe" }]
dependencies = []

[project.scripts]
plural-cognition-cuda-preflight = "plural_cognition.cuda_preflight:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
train = [
  "torch>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
